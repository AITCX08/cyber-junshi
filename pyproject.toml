[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cyber-junshi"
version = "0.1.0"
description = "Agent-native decision support with safety routing, fact layers, option costs, and stop conditions."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AITCX08" }]
keywords = ["agent", "mcp", "decision-support", "safety", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp>=1.27,<2",
  "PyYAML>=6,<7",
  "tomlkit>=0.13,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
cyber-junshi = "cyber_junshi.cli:app"

[project.urls]
Homepage = "https://github.com/AITCX08/cyber-junshi"
Repository = "https://github.com/AITCX08/cyber-junshi"
Issues = "https://github.com/AITCX08/cyber-junshi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cyber_junshi"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
